name: reserva_track

services:
  # Los servicios internos no publican puertos al host. Para desarrollo,
  # copia docker-compose.override.yml.example a
  # docker-compose.override.yml (ya está en .gitignore, es solo tuyo) y
  # Compose lo mezcla automáticamente en `docker compose up` — pero no en el
  # comando de producción, que pasa `-f` explícito y nunca lo incluye.

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reserva_db}
      POSTGRES_USER: ${POSTGRES_USER:-reserva_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reserva_pass}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-reserva_user} -d ${POSTGRES_DB:-reserva_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  web:
    build: 
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    restart: unless-stopped
    env_file: 
      - .env
    environment:
      SEED_DEMO_USERS: "true"
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
    volumes:
      - .:/app
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
  
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    restart: unless-stopped
    env_file: 
      - .env
    volumes:
      - .:/app
    environment:
      # Solo `web` migra: si el worker también lo hace, ambos chocan al crear
      # tablas nuevas cuando arrancan juntos (duplicate key en pg_type).
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info
  
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A config beat -l info

  
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    depends_on: 
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    command: celery -A config flower --port=5555 --address=0.0.0.0

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TIMONEL_ALLOWED_ORIGINS: ${TIMONEL_ALLOWED_ORIGINS:-}
    ports:
      - "8081:80"
      - "443:443"
    volumes:
      - nginx_certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy
  
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8029:8025"
  

volumes:
  postgres_data:
    name: backend_1_postgres_data
  nginx_certs:
